<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video portal + admin panel</title>
  <!-- Video.js + HLS.js -->
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app {
      max-width: 1100px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      padding: 30px;
    }
    h1 {
      font-weight: 600;
      font-size: 1.8rem;
      color: #0b1a33;
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eef2f6;
      padding-bottom: 15px;
    }
    .admin-toggle {
      background: #1a2b4c;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 8px 22px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .admin-toggle:hover {
      background: #2c3f66;
    }
    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin: 25px 0 30px;
    }
    @media (max-width: 700px) {
      .panel {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
    .admin-card {
      background: #f8faff;
      border-radius: 20px;
      padding: 20px 22px;
      border: 1px solid #e6edf6;
    }
    .admin-card h3 {
      margin-top: 0;
      font-weight: 600;
      color: #1a2b4c;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d4dce8;
      border-radius: 14px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      background: white;
    }
    .admin-card button {
      background: #1a2b4c;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 12px 18px;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
    }
    .admin-card button:hover {
      background: #2d3f62;
    }
    .video-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 20px;
    }
    .video-item {
      background: #fafcff;
      border-radius: 24px;
      padding: 18px 22px 22px;
      border: 1px solid #e8edf6;
      transition: 0.2s;
    }
    .video-item .class-name {
      font-weight: 600;
      font-size: 1.25rem;
      color: #0b1a33;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }
    .video-item .play-btn {
      background: #0b1a33;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 12px 28px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      margin: 8px 0 14px;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.03);
    }
    .video-item .play-btn:hover {
      background: #1f3457;
      transform: scale(1.01);
    }
    .video-item .link-area {
      background: #f1f5fe;
      border-radius: 40px;
      padding: 10px 18px;
      font-size: 0.9rem;
      color: #1f3a6b;
      word-break: break-all;
      border: 1px solid #dae2f0;
      display: inline-block;
      max-width: 100%;
      margin-top: 4px;
    }
    .video-item .link-area a {
      color: #0b1a33;
      text-decoration: none;
      font-weight: 500;
    }
    .video-item .link-area a:hover {
      text-decoration: underline;
    }
    .player-wrapper {
      margin-top: 12px;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
    }
    .player-wrapper video {
      width: 100%;
      display: block;
    }
    .empty-state {
      color: #6a7c94;
      padding: 30px 0;
      text-align: center;
      font-style: italic;
    }
    .toast {
      background: #1f3457;
      color: white;
      padding: 8px 20px;
      border-radius: 60px;
      font-size: 0.9rem;
      display: inline-block;
      margin-top: 8px;
    }
    .footer-info {
      font-size: 0.8rem;
      color: #7c8aa0;
      text-align: center;
      margin-top: 20px;
      border-top: 1px solid #eef2f6;
      padding-top: 20px;
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <h1>
    <span>🎬 Video Portal</span>
    <button class="admin-toggle" id="adminToggleBtn">⚙️ Admin</button>
  </h1>

  <!-- Admin panel (hidden by default) -->
  <div id="adminPanel" style="display: none; margin-bottom: 20px;">
    <div class="panel">
      <div class="admin-card">
        <h3>➕ Add new class</h3>
        <input type="text" id="newClassName" placeholder="Class name (e.g. 'Tutorial 1')" />
        <input type="text" id="newClassLink" placeholder="Video URL (HLS / mp4 / etc)" />
        <button id="saveClassBtn">💾 Save & show on website</button>
        <div id="adminFeedback" style="margin-top: 10px; font-size: 0.9rem; color: #1a5d3c;"></div>
      </div>
      <div class="admin-card" style="background: #f4f8ff;">
        <h3>📋 Current entries</h3>
        <div id="adminList" style="max-height: 200px; overflow-y: auto; font-size: 0.9rem; color: #1a2b4c;">
          <!-- rendered by js -->
        </div>
        <div style="margin-top: 10px; font-size: 0.8rem; color: #4d6582;">(stored in localStorage)</div>
      </div>
    </div>
  </div>

  <!-- Video list (user view) -->
  <div id="videoListContainer" class="video-list">
    <!-- dynamic items -->
  </div>
  <div class="footer-info">👇 click "Play" → video player uses video.js + hls.js</div>
</div>

<script>
  (function() {
    // ----- data store (localStorage) -----
    const STORAGE_KEY = 'videoClassData';
    let videoItems = [];

    // Load from localStorage
    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          videoItems = JSON.parse(stored);
          // ensure each item has id
          videoItems = videoItems.filter(item => item && typeof item === 'object');
        } catch (e) {
          videoItems = [];
        }
      } else {
        // seed with demo data
        videoItems = [
          { id: 'demo1', className: 'Big Buck Bunny (HLS)', link: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
          { id: 'demo2', className: 'Sample MP4', link: 'https://www.w3schools.com/html/mov_bbb.mp4' }
        ];
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(videoItems));
    }

    // generate short id
    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
    }

    // ----- render user video list -----
    function renderUserList() {
      const container = document.getElementById('videoListContainer');
      if (!container) return;

      if (!videoItems || videoItems.length === 0) {
        container.innerHTML = `<div class="empty-state">📭 No videos added yet. Use admin panel to add.</div>`;
        return;
      }

      let html = '';
      videoItems.forEach((item, index) => {
        const safeLink = item.link || '#';
        const className = item.className || 'Untitled';
        const itemId = item.id || `item-${index}`;
        // unique player id
        const playerId = `player-${itemId}`;

        html += `
          <div class="video-item" data-id="${itemId}">
            <div class="class-name">📌 ${className}</div>
            <button class="play-btn" data-player-id="${playerId}" data-link="${safeLink}" data-class="${className}">▶ Play</button>
            <div class="link-area">🔗 <a href="${safeLink}" target="_blank">${safeLink.length > 60 ? safeLink.substring(0, 60)+'…' : safeLink}</a></div>
            <div class="player-wrapper" id="wrapper-${playerId}" style="display: none;">
              <video id="${playerId}" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="auto"></video>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      // attach play event listeners (delegation)
      container.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const playerId = this.dataset.playerId;
          const link = this.dataset.link;
          const className = this.dataset.class || 'Video';
          const wrapper = document.getElementById(`wrapper-${playerId}`);
          if (!wrapper) return;

          // if already visible, just toggle? we re-init to be safe
          // but we want to show and play
          wrapper.style.display = 'block';

          // Destroy previous player if exists (avoid duplicate)
          const existingPlayer = window[`player_${playerId}`];
          if (existingPlayer) {
            existingPlayer.dispose();
            delete window[`player_${playerId}`];
          }

          // create videojs player
          const videoElement = document.getElementById(playerId);
          if (!videoElement) return;

          // setup player
          const player = videojs(videoElement, {
            autoplay: true,
            controls: true,
            fluid: true,
            html5: {
              hls: {
                enableLowInitialPlaylist: true,
                smoothQualityChange: true,
                overrideNative: true,   // force hls.js
              },
              nativeAudioTracks: false,
              nativeVideoTracks: false,
            },
          }, function() {
            // on ready
            console.log(`Player ready for ${className}`);
          });

          // store reference
          window[`player_${playerId}`] = player;

          // handle hls.js manually for better compatibility (video.js + hls.js)
          // But video.js already uses hls.js via @videojs/http-streaming (VHS)
          // we also inject hls.js to be safe, but VHS handles it.
          // If link is .m3u8 we let VHS handle, else normal src.
          // but we can also manually use hls.js if needed. We'll use VHS.
          // But to be certain we use hls.js directly as fallback:
          if (Hls.isSupported() && link.includes('.m3u8')) {
            // we will override with hls.js for more control
            // but we keep video.js player, we'll set src via videojs
            // actually, videojs with VHS already works fine.
            // For demonstration of hls.js, we can also attach.
            // But we rely on videojs-http-streaming (VHS) which is built-in.
            // But let's also show hls.js integration: we can use hls.js to load and then feed to video element.
            // However we want to keep video.js controls, so we use videojs.
            // videojs already uses hls.js under the hood via VHS, so we can just set src.
            player.src({
              src: link,
              type: 'application/x-mpegURL'
            });
          } else {
            // mp4 or other
            player.src({
              src: link,
              type: 'video/mp4'
            });
          }
          player.play();

          // scroll to wrapper
          wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
    }

    // ----- render admin list (current entries) -----
    function renderAdminList() {
      const adminList = document.getElementById('adminList');
      if (!adminList) return;
      if (!videoItems || videoItems.length === 0) {
        adminList.innerHTML = `<div style="color:#7a8aa3; padding: 6px 0;">No entries</div>`;
        return;
      }
      let html = '';
      videoItems.forEach((item, idx) => {
        const name = item.className || 'Unnamed';
        const link = item.link || '';
        html += `<div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom:1px solid #e0e8f2;">
          <span><strong>${name}</strong> <span style="color:#4d6582; font-size:0.8rem; word-break:break-word;">${link.substring(0, 40)}${link.length>40?'…':''}</span></span>
          <button class="admin-delete-btn" data-id="${item.id}" style="background:none; border:none; color:#a03d3d; cursor:pointer; font-weight:600;">✕</button>
        </div>`;
      });
      adminList.innerHTML = html;

      // attach delete events
      adminList.querySelectorAll('.admin-delete-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const id = this.dataset.id;
          if (!id) return;
          if (confirm('Delete this class?')) {
            videoItems = videoItems.filter(item => item.id !== id);
            saveData();
            renderAdminList();
            renderUserList();
            document.getElementById('adminFeedback').innerHTML = '🗑️ Entry deleted.';
          }
        });
      });
    }

    // ----- admin add new class -----
    function setupAdminActions() {
      const saveBtn = document.getElementById('saveClassBtn');
      const classNameInput = document.getElementById('newClassName');
      const linkInput = document.getElementById('newClassLink');
      const feedback = document.getElementById('adminFeedback');

      if (saveBtn) {
        saveBtn.addEventListener('click', function() {
          const className = classNameInput.value.trim();
          const link = linkInput.value.trim();
          if (!className || !link) {
            feedback.innerHTML = '⚠️ Please fill both fields.';
            return;
          }
          // check duplicate (optional)
          const newItem = {
            id: genId(),
            className: className,
            link: link
          };
          videoItems.push(newItem);
          saveData();
          classNameInput.value = '';
          linkInput.value = '';
          feedback.innerHTML = `✅ Added "${className}" (${link})`;
          renderAdminList();
          renderUserList();
        });
      }
    }

    // ----- toggle admin panel -----
    function setupAdminToggle() {
      const toggleBtn = document.getElementById('adminToggleBtn');
      const adminPanel = document.getElementById('adminPanel');
      if (toggleBtn && adminPanel) {
        toggleBtn.addEventListener('click', function() {
          const isHidden = adminPanel.style.display === 'none';
          adminPanel.style.display = isHidden ? 'block' : 'none';
          this.textContent = isHidden ? '🔒 Close admin' : '⚙️ Admin';
          if (isHidden) {
            renderAdminList(); // refresh list
          }
        });
      }
    }

    // ----- init players when video item play clicked (delegation) already in renderUserList
    // also handle resizing etc.

    // ----- extra: cleanup on page unload -----
    window.addEventListener('beforeunload', function() {
      // dispose all videojs players
      for (let key in window) {
        if (key.startsWith('player_') && window[key] && typeof window[key].dispose === 'function') {
          try { window[key].dispose(); } catch (e) {}
        }
      }
    });

    // ----- INIT -----
    loadData();
    renderUserList();
    renderAdminList();
    setupAdminActions();
    setupAdminToggle();

    // admin panel hidden by default
    document.getElementById('adminPanel').style.display = 'none';

    console.log('✅ Video portal ready. Admin panel hidden. Use "Admin" button.');
  })();
</script>
</body>
</html>
