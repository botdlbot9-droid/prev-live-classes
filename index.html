<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Classplus Video Player</title>

    <!-- Video.js CDN -->
    <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>

    <!-- HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            padding: 20px;
        }
        .player-wrapper {
            max-width: 900px;
            width: 100%;
            background: #161b22;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }
        .video-title {
            color: #f0f6fc;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            padding-left: 8px;
        }
        .video-js {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .status-bar {
            margin-top: 14px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #21262d;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-bar .success {
            color: #3fb950;
        }
        .status-bar .error {
            color: #f85149;
        }
        .status-bar .loading {
            color: #d29922;
        }
        .btn-retry {
            background: #238636;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-retry:hover {
            background: #2ea043;
        }
        .btn-retry:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .debug-info {
            font-size: 0.75rem;
            color: #484f58;
            margin-top: 8px;
            word-break: break-all;
            padding: 6px 12px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #21262d;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div class="video-title">📺 Classplus Video</div>

        <!-- Video Player -->
        <video id="my-video" class="video-js vjs-default-skin" controls preload="auto" playsinline>
            <p class="vjs-no-js">Please enable JavaScript to view this video.</p>
        </video>

        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">⏳ Initializing player...</span>
            <button class="btn-retry" id="retryBtn">🔄 Retry</button>
        </div>

        <!-- Debug Info -->
        <div class="debug-info" id="debugInfo">🔍 Waiting for video...</div>
    </div>

    <script>
        // ============================================================
        //  CONFIG – CHANGE YOUR VIDEO URL HERE
        // ============================================================
        const VIDEO_URL =
            'https://vs.classplusapp.com/hls/6a7c17d170851ec23806f9f2/720p20.m3u8';

        // CORS proxies (try in order)
        const PROXIES = [
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/'
        ];

        // ============================================================
        //  DOM REFS
        // ============================================================
        const videoEl = document.getElementById('my-video');
        const statusText = document.getElementById('statusText');
        const debugInfo = document.getElementById('debugInfo');
        const retryBtn = document.getElementById('retryBtn');

        let player = null;
        let hlsInstance = null;
        let currentAttempt = 0;
        let isPlaying = false;

        // ============================================================
        //  STATUS HELPER
        // ============================================================
        function setStatus(msg, type = 'loading') {
            statusText.innerHTML = msg;
            statusText.className = type;
        }

        function setDebug(msg) {
            debugInfo.textContent = '🔍 ' + msg;
        }

        // ============================================================
        //  DESTROY OLD PLAYER / HLS
        // ============================================================
        function destroyPlayer() {
            if (hlsInstance) {
                try { hlsInstance.destroy(); } catch (e) {}
                hlsInstance = null;
            }
            if (player) {
                try { player.dispose(); } catch (e) {}
                player = null;
            }
            // Reset video element
            videoEl.removeAttribute('src');
            videoEl.load();
        }

        // ============================================================
        //  METHOD 1: HLS.js DIRECT (with Referer headers)
        // ============================================================
        function loadWithHlsJs(url, referer = 'https://classplusapp.com/') {
            return new Promise((resolve, reject) => {
                if (!Hls.isSupported()) {
                    reject(new Error('HLS.js not supported in this browser'));
                    return;
                }

                setStatus('📡 Loading with HLS.js...', 'loading');
                setDebug(`HLS.js: ${url.substring(0, 80)}...`);

                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr, xhrUrl) {
                        // Add important headers
                        xhr.setRequestHeader('Referer', referer);
                        xhr.setRequestHeader('Origin', 'https://classplusapp.com');
                        xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                        // If you have cookies, add here:
                        // xhr.setRequestHeader('Cookie', 'your_cookie_here');
                    }
                });

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    setStatus('✅ Manifest loaded – playing...', 'success');
                    setDebug('✅ HLS.js: Manifest parsed successfully');
                    isPlaying = true;
                    resolve(hls);
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        reject(new Error('HLS.js fatal error: ' + JSON.stringify(data)));
                    } else {
                        setDebug('⚠️ HLS.js non-fatal: ' + data.type);
                    }
                });

                hls.loadSource(url);
                hls.attachMedia(videoEl);

                // Store reference
                hlsInstance = hls;
            });
        }

        // ============================================================
        //  METHOD 2: Video.js + CORS Proxy
        // ============================================================
        function loadWithVideoJsProxy(proxyUrl, originalUrl) {
            return new Promise((resolve, reject) => {
                const finalUrl = proxyUrl + encodeURIComponent(originalUrl);

                setStatus('🌐 Loading via CORS proxy...', 'loading');
                setDebug(`Proxy: ${proxyUrl.substring(0, 50)}...`);

                player = videojs(videoEl, {
                    controls: true,
                    autoplay: false,
                    fluid: true,
                    html5: {
                        hls: {
                            enableLowInitialPlaylist: true,
                            smoothQualityChange: true,
                            overrideNative: true,
                        }
                    },
                    sources: [{
                        src: finalUrl,
                        type: 'application/x-mpegURL'
                    }]
                });

                player.ready(function() {
                    setStatus('✅ Video.js ready – playing...', 'success');
                    setDebug('✅ Video.js: Player ready');
                    isPlaying = true;
                    resolve(player);
                });

                player.on('error', function() {
                    const err = player.error();
                    reject(new Error('Video.js error: ' + (err ? err.message : 'unknown')));
                });

                // Store reference
                player = player;
            });
        }

        // ============================================================
        //  METHOD 3: Native HLS (Safari) + CORS Proxy
        // ============================================================
        function loadNativeHls(proxyUrl, originalUrl) {
            return new Promise((resolve, reject) => {
                const finalUrl = proxyUrl + encodeURIComponent(originalUrl);

                setStatus('🍎 Native HLS (Safari) + proxy...', 'loading');
                setDebug(`Native: ${finalUrl.substring(0, 80)}...`);

                videoEl.src = finalUrl;
                videoEl.load();

                const playPromise = videoEl.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            setStatus('✅ Native HLS playing', 'success');
                            setDebug('✅ Native HLS: playing');
                            isPlaying = true;
                            resolve(videoEl);
                        })
                        .catch((err) => {
                            reject(new Error('Native play failed: ' + err.message));
                        });
                } else {
                    // Some browsers return undefined
                    setTimeout(() => {
                        if (!videoEl.paused) {
                            setStatus('✅ Native HLS playing', 'success');
                            setDebug('✅ Native HLS: playing (fallback)');
                            isPlaying = true;
                            resolve(videoEl);
                        } else {
                            reject(new Error('Native HLS: playback not started'));
                        }
                    }, 2000);
                }
            });
        }

        // ============================================================
        //  MAIN LOADER – tries methods in sequence
        // ============================================================
        async function loadVideo() {
            destroyPlayer();
            isPlaying = false;
            retryBtn.disabled = true;
            setStatus('🔄 Starting load attempts...', 'loading');

            const methods = [
                // 1. HLS.js with Referer
                () => loadWithHlsJs(VIDEO_URL, 'https://classplusapp.com/'),

                // 2. HLS.js with Classplus specific referer
                () => loadWithHlsJs(VIDEO_URL, 'https://vs.classplusapp.com/'),

                // 3. Video.js + CORS proxies
                () => loadWithVideoJsProxy(PROXIES[0], VIDEO_URL),
                () => loadWithVideoJsProxy(PROXIES[1], VIDEO_URL),
                () => loadWithVideoJsProxy(PROXIES[2], VIDEO_URL),

                // 4. Native HLS + proxies
                () => loadNativeHls(PROXIES[0], VIDEO_URL),
                () => loadNativeHls(PROXIES[1], VIDEO_URL),
                () => loadNativeHls(PROXIES[2], VIDEO_URL),

                // 5. Direct URL (last resort)
                () => loadWithHlsJs(VIDEO_URL, document.location.origin),
            ];

            for (let i = 0; i < methods.length; i++) {
                currentAttempt = i + 1;
                setDebug(`Attempt ${currentAttempt}/${methods.length}...`);

                try {
                    const result = await methods[i]();
                    setStatus('✅ Video playing successfully!', 'success');
                    setDebug(`✅ Success with method ${currentAttempt}`);
                    retryBtn.disabled = false;
                    return result;
                } catch (err) {
                    console.warn(`Method ${currentAttempt} failed:`, err);
                    setDebug(`❌ Attempt ${currentAttempt} failed: ${err.message.substring(0, 60)}`);
                    // Clean up after failed attempt
                    destroyPlayer();
                }
            }

            // All methods failed
            setStatus('❌ All playback methods failed. Check console.', 'error');
            setDebug('❌ All attempts failed. Video may be restricted or link expired.');
            retryBtn.disabled = false;
            throw new Error('All playback methods failed');
        }

        // ============================================================
        //  RETRY LOGIC
        // ============================================================
        retryBtn.addEventListener('click', function() {
            loadVideo().catch(err => {
                setStatus('❌ Retry failed: ' + err.message, 'error');
                setDebug('❌ ' + err.message);
            });
        });

        // ============================================================
        //  HANDLE PAGE VISIBILITY (pause/resume)
        // ============================================================
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && player) {
                player.pause && player.pause();
            }
        });

        // ============================================================
        //  AUTO-START
        // ============================================================
        loadVideo().catch(err => {
            setStatus('⚠️ Initial load failed – click Retry', 'error');
            setDebug('⚠️ ' + err.message);
            retryBtn.disabled = false;
        });

        console.log('🎬 Classplus Video Player loaded');
        console.log('🔗 Video URL:', VIDEO_URL);
        console.log('📦 Proxies:', PROXIES);
    </script>

</body>
</html>
