<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Portal</title>
  <!-- Video.js + HLS.js -->
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f4fb; min-height: 100vh; display: flex; justify-content: center; padding: 30px 16px; }
    .app { max-width: 1100px; width: 100%; background: white; border-radius: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); padding: 28px 30px; }
    .header { border-bottom: 1px solid #e8edf6; padding-bottom: 18px; margin-bottom: 24px; }
    .header h1 { font-weight: 600; font-size: 1.9rem; color: #0b1a33; letter-spacing: -0.3px; }
    .video-list { display: flex; flex-direction: column; gap: 28px; margin-top: 10px; }
    .video-item { background: #fafdff; border-radius: 24px; padding: 20px 24px 24px; border: 1px solid #e6edf6; transition: 0.15s; }
    .video-item:hover { border-color: #c8d4e4; }
    .video-item .class-name { font-weight: 600; font-size: 1.3rem; color: #0b1a33; margin-bottom: 6px; }
    .play-btn { background: #0b1a33; color: white; border: none; border-radius: 40px; padding: 12px 32px; font-weight: 500; font-size: 1rem; cursor: pointer; margin: 12px 0 8px; transition: 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .play-btn:hover { background: #1f3457; transform: scale(1.01); }
    .player-wrapper { margin-top: 14px; border-radius: 20px; overflow: hidden; background: #000; }
    .empty-state { color: #6a7c94; padding: 40px 0; text-align: center; font-style: italic; }
    .footer-note { color: #7c8aa0; font-size: 0.8rem; text-align: center; margin-top: 30px; border-top: 1px solid #eef2f6; padding-top: 22px; }
    .loading { text-align: center; padding: 40px; color: #4c637f; }
    .error-msg { background: #fee; color: #b33a3a; padding: 12px 20px; border-radius: 12px; margin: 10px 0; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>📽️ Video Portal</h1>
  </div>
  <!-- user video list (only class name + play button, no link, no admin) -->
  <div id="videoListContainer" class="video-list">
    <div class="loading">Loading videos...</div>
  </div>
  <div class="footer-note">⬇️ Click Play → video.js + hls.js player</div>
</div>

<script>
  (function() {
    // ---------- CONFIG ----------
    // Replace with your Cloudflare Worker / API endpoint
    const API_BASE = 'https://your-cloudflare-worker.workers.dev/api/videos';
    const STORAGE_KEY = 'videoClassData';

    let videoItems = [];

    // ---------- DATA HELPERS ----------
    function loadFromStorage() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try { videoItems = JSON.parse(stored); if (!Array.isArray(videoItems)) videoItems = []; } 
        catch(e) { videoItems = []; }
      } else {
        // fallback demo data
        videoItems = [
          { id: 'demo1', className: 'Big Buck Bunny (HLS)', link: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
          { id: 'demo2', className: 'Sample MP4', link: 'https://www.w3schools.com/html/mov_bbb.mp4' }
        ];
        saveToStorage();
      }
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(videoItems));
    }

    // ---------- FETCH FROM CLOUDFLARE API ----------
    async function fetchFromCloudflare() {
      const container = document.getElementById('videoListContainer');
      try {
        if (!API_BASE || API_BASE.includes('your-cloudflare')) {
          // API not configured, use local storage
          loadFromStorage();
          renderUserList();
          return;
        }

        const response = await fetch(API_BASE);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (data.items && Array.isArray(data.items)) {
          videoItems = data.items;
          saveToStorage();
          renderUserList();
        } else {
          // fallback to local
          loadFromStorage();
          renderUserList();
        }
      } catch (error) {
        console.warn('Cloudflare fetch failed, using local data:', error);
        loadFromStorage();
        renderUserList();
        // show error but still display content
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-msg';
        errorDiv.textContent = '⚠️ Could not connect to server. Showing cached content.';
        container.prepend(errorDiv);
      }
    }

    // ---------- RENDER USER LIST (no link shown, no admin) ----------
    function renderUserList() {
      const container = document.getElementById('videoListContainer');
      if (!container) return;

      // Remove any existing error messages from previous renders
      const existingError = container.querySelector('.error-msg');
      if (existingError) existingError.remove();

      if (!videoItems.length) {
        container.innerHTML = `<div class="empty-state">📭 No videos available.</div>`;
        return;
      }

      let html = '';
      videoItems.forEach(item => {
        const link = item.link || '#';
        const className = item.className || 'Untitled';
        const playerId = `player-${item.id || Date.now().toString(36) + Math.random().toString(36).substring(2,6)}`;
        html += `
          <div class="video-item" data-id="${item.id}">
            <div class="class-name">📌 ${className}</div>
            <button class="play-btn" data-player-id="${playerId}" data-link="${link}" data-class="${className}">▶ Play</button>
            <!-- link is hidden from user -->
            <div class="player-wrapper" id="wrapper-${playerId}" style="display: none;">
              <video id="${playerId}" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="auto"></video>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      // Play button events
      container.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const playerId = this.dataset.playerId;
          const link = this.dataset.link;
          const wrapper = document.getElementById(`wrapper-${playerId}`);
          if (!wrapper) return;
          
          // Toggle visibility
          if (wrapper.style.display === 'block') {
            // If already visible, hide it (optional)
            // wrapper.style.display = 'none';
            // return;
          }
          wrapper.style.display = 'block';
          
          // Dispose existing player
          if (window[`player_${playerId}`]) {
            try { window[`player_${playerId}`].dispose(); } catch(e) {}
            delete window[`player_${playerId}`];
          }

          const videoEl = document.getElementById(playerId);
          if (!videoEl) return;
          
          const player = videojs(videoEl, {
            autoplay: true,
            controls: true,
            fluid: true,
            html5: {
              hls: { 
                enableLowInitialPlaylist: true, 
                smoothQualityChange: true, 
                overrideNative: true 
              },
              nativeAudioTracks: false, 
              nativeVideoTracks: false,
            }
          });
          window[`player_${playerId}`] = player;
          
          // Set source based on URL type
          if (link.includes('.m3u8') || link.includes('m3u8')) {
            player.src({ src: link, type: 'application/x-mpegURL' });
          } else {
            player.src({ src: link, type: 'video/mp4' });
          }
          player.play();
          wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
    }

    // ---------- DISPOSE PLAYERS ON UNLOAD ----------
    window.addEventListener('beforeunload', function() {
      for (let key in window) {
        if (key.startsWith('player_') && window[key] && typeof window[key].dispose === 'function') {
          try { window[key].dispose(); } catch(e) {}
        }
      }
    });

    // ---------- INIT ----------
    // First try to load from storage for immediate display
    loadFromStorage();
    renderUserList();
    
    // Then try to fetch fresh data from Cloudflare
    setTimeout(() => {
      if (API_BASE && !API_BASE.includes('your-cloudflare')) {
        fetchFromCloudflare();
      }
    }, 300);

    console.log('✅ Video Portal loaded (user view - no admin)');
  })();
</script>
</body>
</html>
