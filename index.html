<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Portal</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f4fb; min-height: 100vh; display: flex; justify-content: center; padding: 30px 16px; }
    .app { max-width: 1100px; width: 100%; background: white; border-radius: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); padding: 28px 30px; }
    .header { border-bottom: 1px solid #e8edf6; padding-bottom: 18px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-weight: 600; font-size: 1.9rem; color: #0b1a33; }
    
    /* Login Form */
    .login-container { max-width: 450px; margin: 40px auto; padding: 30px; background: #f8faff; border-radius: 24px; border: 1px solid #e6edf6; }
    .login-container h2 { margin-bottom: 20px; color: #0b1a33; }
    .login-container input { width: 100%; padding: 12px 16px; border: 1px solid #d9e1ec; border-radius: 16px; font-size: 0.95rem; margin-bottom: 12px; }
    .login-container button { width: 100%; padding: 12px; background: #0b1a33; color: white; border: none; border-radius: 16px; font-weight: 600; cursor: pointer; }
    .login-container .error { color: #b33a3a; font-size: 0.9rem; margin-top: 8px; }
    
    .playlist-selector { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; padding: 16px; background: #f8faff; border-radius: 20px; }
    .playlist-btn { padding: 10px 24px; border: 2px solid #d9e1ec; border-radius: 40px; background: white; color: #1a2b4c; font-weight: 500; cursor: pointer; transition: 0.15s; }
    .playlist-btn:hover { border-color: #1a2b4c; background: #f0f4fe; }
    .playlist-btn.active { border-color: #1a2b4c; background: #1a2b4c; color: white; }
    .chapter-item { background: #fafdff; border-radius: 20px; padding: 16px 22px; margin-bottom: 14px; border: 1px solid #e6edf6; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .chapter-number { font-weight: 700; color: #1a2b4c; font-size: 1.1rem; min-width: 80px; }
    .chapter-name { font-weight: 600; font-size: 1.1rem; color: #0b1a33; flex: 1; }
    .play-btn { background: #0b1a33; color: white; border: none; border-radius: 40px; padding: 8px 24px; font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: 0.15s; }
    .play-btn:hover { background: #1f3457; }
    .player-wrapper { width: 100%; margin-top: 12px; border-radius: 16px; overflow: hidden; background: #000; }
    .empty-state { color: #6a7c94; padding: 40px 0; text-align: center; font-style: italic; }
    .playlist-title { font-size: 1.4rem; font-weight: 600; color: #0b1a33; margin-bottom: 16px; }
    .status-bar { font-size: 0.8rem; padding: 8px 16px; border-radius: 40px; display: inline-block; margin-bottom: 16px; background: #f0f4fb; color: #4c637f; }
    .user-info { font-size: 0.85rem; color: #4c637f; }
    .logout-btn { background: none; border: 1px solid #d9e1ec; padding: 6px 16px; border-radius: 40px; cursor: pointer; }
    .logout-btn:hover { background: #fee; border-color: #b33a3a; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📽️ Video Portal</h1>
    <div id="userInfo" class="user-info"></div>
  </div>
  
  <!-- Login Form -->
  <div id="loginContainer" class="login-container">
    <h2>🔐 Login to Access Videos</h2>
    <p style="color:#4c637f; margin-bottom:16px;">Enter your email and access key</p>
    <input type="email" id="loginEmail" placeholder="Enter your email" />
    <input type="text" id="loginKey" placeholder="Enter your access key" />
    <button id="loginBtn">Login</button>
    <div id="loginError" class="error"></div>
  </div>

  <!-- Video Content (hidden until login) -->
  <div id="videoContent" style="display: none;">
    <div id="statusBar" class="status-bar">🔄 Loading videos...</div>
    <div id="playlistSelector" class="playlist-selector">
      <div class="empty-state">Loading playlists...</div>
    </div>
    <div id="chaptersContainer">
      <div class="empty-state">Select a playlist to view chapters</div>
    </div>
  </div>
  
  <div class="footer-note" style="color:#7c8aa0; font-size:0.8rem; text-align:center; margin-top:30px; border-top:1px solid #eef2f6; padding-top:22px;">
    ⬇️ Click Play on any chapter → video.js + hls.js player
  </div>
</div>

<script>
  (function() {
    const API_BASE = 'https://video-play-api.newstreamcp.workers.dev/api';
    let playlists = [];
    let currentPlaylistId = null;
    let currentUser = null;

    // ----- Login -----
    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const key = document.getElementById('loginKey').value.trim();
      const errorEl = document.getElementById('loginError');

      if (!email || !key) {
        errorEl.textContent = '⚠️ Please enter both email and key';
        return;
      }

      try {
        const response = await fetch(API_BASE + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, key })
        });

        const data = await response.json();

        if (data.success) {
          currentUser = data.user;
          document.getElementById('loginContainer').style.display = 'none';
          document.getElementById('videoContent').style.display = 'block';
          document.getElementById('userInfo').innerHTML = `
            👤 ${data.user.email} 
            <button class="logout-btn" onclick="window.logout()">Logout</button>
          `;
          fetchPlaylists();
        } else {
          errorEl.textContent = '❌ ' + (data.error || 'Login failed');
        }
      } catch (error) {
        errorEl.textContent = '❌ Connection error: ' + error.message;
      }
    }

    // ----- Logout -----
    window.logout = function() {
      currentUser = null;
      document.getElementById('loginContainer').style.display = 'block';
      document.getElementById('videoContent').style.display = 'none';
      document.getElementById('userInfo').innerHTML = '';
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginKey').value = '';
      document.getElementById('loginError').textContent = '';
    };

    // ----- Fetch Playlists -----
    async function fetchPlaylists() {
      const statusBar = document.getElementById('statusBar');
      try {
        statusBar.textContent = '🔄 Fetching videos...';
        const response = await fetch(API_BASE + '/playlists');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (data.success) {
          playlists = data.playlists;
          statusBar.textContent = `✅ ${playlists.length} playlists loaded`;
          renderPlaylists();
        }
      } catch (error) {
        statusBar.textContent = '❌ Failed to load videos';
        console.error(error);
      }
    }

    // ----- Render Playlists -----
    function renderPlaylists() {
      const container = document.getElementById('playlistSelector');
      if (!playlists.length) {
        container.innerHTML = `<div class="empty-state">No playlists available</div>`;
        document.getElementById('chaptersContainer').innerHTML = `<div class="empty-state">No playlists available</div>`;
        return;
      }

      let html = '';
      playlists.forEach(playlist => {
        const isActive = playlist.id === currentPlaylistId;
        html += `<button class="playlist-btn ${isActive ? 'active' : ''}" data-id="${playlist.id}">${playlist.name}</button>`;
      });
      container.innerHTML = html;

      container.querySelectorAll('.playlist-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          currentPlaylistId = this.dataset.id;
          renderPlaylists();
          renderChapters(currentPlaylistId);
        });
      });

      if (!currentPlaylistId && playlists.length > 0) {
        currentPlaylistId = playlists[0].id;
        renderPlaylists();
        renderChapters(currentPlaylistId);
      }
    }

    // ----- Render Chapters -----
    function renderChapters(playlistId) {
      const container = document.getElementById('chaptersContainer');
      const playlist = playlists.find(p => p.id === playlistId);
      
      if (!playlist) {
        container.innerHTML = `<div class="empty-state">Playlist not found</div>`;
        return;
      }

      if (!playlist.chapters || playlist.chapters.length === 0) {
        container.innerHTML = `<div class="empty-state">No chapters in this playlist</div>`;
        return;
      }

      let html = `<div class="playlist-title">📚 ${playlist.name}</div>`;
      playlist.chapters.forEach((chapter, index) => {
        const playerId = `player-${chapter.id || 'ch_' + Date.now()}`;
        html += `
          <div class="chapter-item">
            <span class="chapter-number">Chapter ${index + 1}</span>
            <span class="chapter-name">${chapter.name}</span>
            <button class="play-btn" data-player-id="${playerId}" data-link="${chapter.link}">▶ Play</button>
            <div class="player-wrapper" id="wrapper-${playerId}" style="display: none;">
              <video id="${playerId}" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="auto"></video>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      container.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const playerId = this.dataset.playerId;
          const link = this.dataset.link;
          const wrapper = document.getElementById(`wrapper-${playerId}`);
          if (!wrapper) return;
          
          if (wrapper.style.display === 'block') {
            wrapper.style.display = 'none';
            if (window[`player_${playerId}`]) {
              try { window[`player_${playerId}`].dispose(); } catch(e) {}
              delete window[`player_${playerId}`];
            }
            return;
          }
          
          wrapper.style.display = 'block';
          if (window[`player_${playerId}`]) {
            try { window[`player_${playerId}`].dispose(); } catch(e) {}
            delete window[`player_${playerId}`];
          }

          const videoEl = document.getElementById(playerId);
          if (!videoEl) return;
          
          const player = videojs(videoEl, {
            autoplay: true,
            controls: true,
            fluid: true,
            html5: {
              hls: { enableLowInitialPlaylist: true, smoothQualityChange: true, overrideNative: true },
              nativeAudioTracks: false, nativeVideoTracks: false,
            }
          });
          window[`player_${playerId}`] = player;
          
          if (link.includes('.m3u8')) {
            player.src({ src: link, type: 'application/x-mpegURL' });
          } else {
            player.src({ src: link, type: 'video/mp4' });
          }
          player.play();
          wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
    }

    // ----- Event Listeners -----
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('loginKey').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    document.getElementById('loginEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

    // ----- Dispose players on unload -----
    window.addEventListener('beforeunload', function() {
      for (let key in window) {
        if (key.startsWith('player_') && window[key] && typeof window[key].dispose === 'function') {
          try { window[key].dispose(); } catch(e) {}
        }
      }
    });

    console.log('✅ Video Portal loaded');
  })();
</script>
</body>
</html>
