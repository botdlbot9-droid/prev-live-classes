<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Complete System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f4fb; min-height: 100vh; display: flex; justify-content: center; padding: 30px 16px; }
    .app { max-width: 900px; width: 100%; background: white; border-radius: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); padding: 28px 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8edf6; padding-bottom: 18px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-weight: 600; font-size: 1.9rem; color: #0b1a33; }
    .badge { background: #eef3fa; padding: 6px 16px; border-radius: 40px; font-size: 0.8rem; color: #4c637f; }
    
    .section-title { font-weight: 600; color: #0b1a33; margin-top: 24px; margin-bottom: 8px; font-size: 1.1rem; border-bottom: 2px solid #e8edf6; padding-bottom: 8px; }
    .flex-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .flex-row > * { flex: 1; min-width: 150px; }
    
    input, select { width: 100%; padding: 12px 16px; border: 1px solid #d9e1ec; border-radius: 20px; font-size: 0.95rem; background: #fafcff; }
    input:focus, select:focus { border-color: #1a2b4c; outline: none; background: white; }
    
    .btn { padding: 12px 28px; border: none; border-radius: 60px; font-weight: 500; cursor: pointer; transition: 0.15s; flex:1; min-width:120px; }
    .btn-primary { background: #1a2b4c; color: white; }
    .btn-primary:hover { background: #2f4370; }
    .btn-success { background: #1a7a3a; color: white; }
    .btn-success:hover { background: #1f944a; }
    .btn-danger { background: #b33a3a; color: white; }
    .btn-danger:hover { background: #992e2e; }
    .btn-outline { background: transparent; color: #1a2b4c; border: 1px solid #d0dae8; }
    .btn-outline:hover { background: #f0f4fe; }
    .btn-sm { padding: 8px 18px; font-size: 0.85rem; flex: 0; }
    
    .entry-list { background: #f5f8fe; border-radius: 20px; padding: 6px 0; margin: 12px 0 6px; max-height: 350px; overflow-y: auto; }
    .entry-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e6edf6; }
    .entry-item:last-child { border-bottom: none; }
    .entry-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .entry-item .name { font-weight: 600; color: #0b1a33; }
    .entry-item .sub { color: #4c637f; font-size: 0.8rem; word-break: break-all; }
    .entry-item .del-btn { background: none; border: none; color: #b33a3a; font-size: 1.2rem; cursor: pointer; padding: 4px 10px; border-radius: 40px; }
    .entry-item .del-btn:hover { background: #ffe6e6; }
    .entry-item .key-btn { background: none; border: 1px solid #d0dae8; border-radius: 40px; padding: 4px 12px; cursor: pointer; font-size: 0.8rem; }
    .entry-item .key-btn:hover { background: #e6edf6; }
    
    .empty-state { color: #6a7c94; padding: 20px 0; text-align: center; font-style: italic; }
    .toast-msg { font-size: 0.9rem; margin-top: 12px; padding: 8px 16px; border-radius: 60px; display: inline-block; }
    .toast-error { background: #fee; color: #b33a3a; }
    .toast-success { background: #e6f5e6; color: #1a5d3c; }
    .toast-info { background: #e6f0fa; color: #1a3f5c; }
    
    .password-gate { background: #f8faff; border-radius: 20px; padding: 24px; margin-top: 10px; }
    .password-gate .pwd-error { color: #b33a3a; font-size: 0.9rem; margin-top: 6px; }
    .api-status { font-size: 0.8rem; color: #4c637f; padding: 6px 14px; background: #eef3fa; border-radius: 40px; display: inline-block; }
    .status-connected { background: #e6f5e6; color: #1a5d3c; }
    
    .playlist-header { background: #eef3fa; padding: 10px 16px; font-weight: 700; border-radius: 12px; margin: 8px 0 4px; display: flex; justify-content: space-between; align-items: center; }
    .tab-buttons { display: flex; gap: 12px; margin-bottom: 16px; }
    .tab-btn { padding: 10px 24px; border: 2px solid #d9e1ec; border-radius: 40px; background: white; cursor: pointer; font-weight: 500; }
    .tab-btn.active { border-color: #1a2b4c; background: #1a2b4c; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .key-display { background: #f0f4fb; padding: 12px 16px; border-radius: 12px; font-family: monospace; word-break: break-all; margin: 8px 0; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚙️ Admin Panel</h1>
    <span class="badge">🔐 Protected</span>
  </div>

  <!-- Password Gate -->
  <div id="passwordGate" class="password-gate">
    <label for="adminPwdInput">Enter admin password</label>
    <input type="password" id="adminPwdInput" placeholder="••••••••" />
    <div id="pwdError" class="pwd-error"></div>
    <div class="flex-row">
      <button class="btn btn-primary" id="unlockBtn">🔓 Unlock</button>
    </div>
  </div>

  <!-- Admin Content -->
  <div id="adminContent" style="display: none;">
    <div class="flex-row" style="margin-bottom:16px;">
      <span class="api-status" id="apiStatus">🗄️ D1 Database</span>
      <button class="btn btn-outline btn-sm" id="refreshBtn">📥 Refresh</button>
    </div>

    <!-- Tabs -->
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="playlists">📁 Playlists</button>
      <button class="tab-btn" data-tab="users">👥 Users</button>
    </div>

    <!-- Playlists Tab -->
    <div id="tab-playlists" class="tab-content active">
      <div class="section-title">📁 Add New Playlist</div>
      <div class="flex-row">
        <input type="text" id="newPlaylistName" placeholder="Playlist name" />
        <button class="btn btn-success" id="addPlaylistBtn">➕ Add</button>
      </div>
      <div id="playlistFeedback" class="toast-msg"></div>

      <div class="section-title">📝 Add Chapter</div>
      <div class="flex-row">
        <select id="playlistSelect"><option value="">Select playlist</option></select>
      </div>
      <div class="flex-row">
        <input type="text" id="chapterName" placeholder="Chapter name" />
        <input type="text" id="chapterLink" placeholder="Video URL" />
      </div>
      <div class="flex-row">
        <button class="btn btn-primary" id="addChapterBtn">➕ Add Chapter</button>
      </div>
      <div id="chapterFeedback" class="toast-msg"></div>

      <div class="section-title">📋 All Playlists & Chapters</div>
      <div class="entry-list" id="adminList"><div class="empty-state">Loading...</div></div>
    </div>

    <!-- Users Tab -->
    <div id="tab-users" class="tab-content">
      <div class="section-title">👤 Add New User</div>
      <div class="flex-row">
        <input type="email" id="newUserEmail" placeholder="User email" />
        <button class="btn btn-success" id="addUserBtn">➕ Add User</button>
      </div>
      <div id="userFeedback" class="toast-msg"></div>

      <div class="section-title">🔑 Generate New Key</div>
      <div class="flex-row">
        <select id="userSelect"><option value="">Select user</option></select>
        <button class="btn btn-primary" id="generateKeyBtn">🔄 Generate Key</button>
      </div>
      <div id="keyDisplay" class="key-display" style="display:none;"></div>
      <div id="keyFeedback" class="toast-msg"></div>

      <div class="section-title">👥 All Users</div>
      <div class="entry-list" id="userList"><div class="empty-state">Loading...</div></div>
    </div>
    
    <div style="margin-top:20px; border-top:1px solid #e8edf6; padding-top:18px;">
      <button class="btn btn-danger" id="logoutBtn" style="flex:0; padding:8px 24px;">🚪 Logout</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const API_BASE = 'https://video-play-api.newstreamcp.workers.dev/api';
    const ADMIN_PASSWORD = 'admin123';
    let playlists = [];
    let users = [];

    // ----- Tabs -----
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('tab-' + this.dataset.tab).classList.add('active');
        if (this.dataset.tab === 'users') loadUsers();
        if (this.dataset.tab === 'playlists') loadPlaylists();
      });
    });

    // ----- Load Playlists -----
    async function loadPlaylists() {
      try {
        const response = await fetch(API_BASE + '/playlists');
        const data = await response.json();
        if (data.success) {
          playlists = data.playlists;
          renderAdminList();
          updatePlaylistSelect();
          updateApiStatus('connected');
        }
      } catch (error) {
        showFeedback('❌ Failed to load: ' + error.message, 'error', 'playlistFeedback');
      }
    }

    // ----- Load Users -----
    async function loadUsers() {
      try {
        const response = await fetch(API_BASE + '/users');
        const data = await response.json();
        if (data.success) {
          users = data.users;
          renderUserList();
          updateUserSelect();
        }
      } catch (error) {
        showFeedback('❌ Failed to load users', 'error', 'userFeedback');
      }
    }

    // ----- Add Playlist -----
    async function addPlaylist() {
      const name = document.getElementById('newPlaylistName').value.trim();
      if (!name) {
        showFeedback('⚠️ Enter playlist name', 'error', 'playlistFeedback');
        return;
      }
      try {
        const response = await fetch(API_BASE + '/playlists', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('newPlaylistName').value = '';
          showFeedback('✅ Playlist added', 'success', 'playlistFeedback');
          loadPlaylists();
        }
      } catch (error) {
        showFeedback('❌ Failed: ' + error.message, 'error', 'playlistFeedback');
      }
    }

    // ----- Add Chapter -----
    async function addChapter() {
      const playlistId = document.getElementById('playlistSelect').value;
      const name = document.getElementById('chapterName').value.trim();
      const link = document.getElementById('chapterLink').value.trim();
      if (!playlistId || !name || !link) {
        showFeedback('⚠️ Fill all fields', 'error', 'chapterFeedback');
        return;
      }
      try {
        const response = await fetch(API_BASE + '/playlists/chapter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistId, chapterName: name, chapterLink: link })
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('chapterName').value = '';
          document.getElementById('chapterLink').value = '';
          showFeedback('✅ Chapter added', 'success', 'chapterFeedback');
          loadPlaylists();
        }
      } catch (error) {
        showFeedback('❌ Failed: ' + error.message, 'error', 'chapterFeedback');
      }
    }

    // ----- Add User -----
    async function addUser() {
      const email = document.getElementById('newUserEmail').value.trim();
      if (!email) {
        showFeedback('⚠️ Enter email', 'error', 'userFeedback');
        return;
      }
      try {
        const response = await fetch(API_BASE + '/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('newUserEmail').value = '';
          showFeedback('✅ User added. Key: ' + data.key, 'success', 'userFeedback');
          loadUsers();
        } else {
          showFeedback('❌ ' + data.error, 'error', 'userFeedback');
        }
      } catch (error) {
        showFeedback('❌ Failed: ' + error.message, 'error', 'userFeedback');
      }
    }

    // ----- Generate Key -----
    async function generateKey() {
      const userId = document.getElementById('userSelect').value;
      if (!userId) {
        showFeedback('⚠️ Select a user', 'error', 'keyFeedback');
        return;
      }
      try {
        const response = await fetch(API_BASE + '/keys/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        const data = await response.json();
        if (data.success) {
          const display = document.getElementById('keyDisplay');
          display.style.display = 'block';
          display.innerHTML = `🔑 New Key: <strong>${data.key}</strong><br><small>Expires: ${new Date(data.expires_at).toLocaleString()}</small>`;
          showFeedback('✅ Key generated', 'success', 'keyFeedback');
          loadUsers();
        }
      } catch (error) {
        showFeedback('❌ Failed: ' + error.message, 'error', 'keyFeedback');
      }
    }

    // ----- Delete Playlist -----
    async function deletePlaylist(playlistId) {
      if (!confirm('Delete this playlist and all chapters?')) return;
      try {
        await fetch(API_BASE + '/playlists', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistId })
        });
        loadPlaylists();
        showFeedback('🗑️ Deleted', 'success', 'playlistFeedback');
      } catch (error) {
        showFeedback('❌ Failed to delete', 'error', 'playlistFeedback');
      }
    }

    // ----- Delete Chapter -----
    async function deleteChapter(playlistId, chapterId) {
      if (!confirm('Delete this chapter?')) return;
      try {
        await fetch(API_BASE + '/playlists/chapter', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistId, chapterId })
        });
        loadPlaylists();
        showFeedback('🗑️ Deleted', 'success', 'playlistFeedback');
      } catch (error) {
        showFeedback('❌ Failed to delete', 'error', 'playlistFeedback');
      }
    }

    // ----- Delete User -----
    async function deleteUser(userId) {
      if (!confirm('Delete this user and all their keys?')) return;
      try {
        await fetch(API_BASE + '/users', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        loadUsers();
        showFeedback('🗑️ User deleted', 'success', 'userFeedback');
      } catch (error) {
        showFeedback('❌ Failed to delete', 'error', 'userFeedback');
      }
    }

    // ----- Render Functions -----
    function renderAdminList() {
      const list = document.getElementById('adminList');
      if (!playlists.length) {
        list.innerHTML = `<div class="empty-state">No playlists</div>`;
        return;
      }
      let html = '';
      playlists.forEach(playlist => {
        html += `
          <div class="playlist-header">
            📁 ${playlist.name}
            <button class="del-btn" onclick="window.deletePlaylist('${playlist.id}')">✕</button>
          </div>
        `;
        if (playlist.chapters?.length) {
          playlist.chapters.forEach(chapter => {
            html += `
              <div class="entry-item" style="padding-left:32px;">
                <div class="info">
                  <span class="name">${chapter.name}</span>
                  <span class="sub">${chapter.link}</span>
                </div>
                <button class="del-btn" onclick="window.deleteChapter('${playlist.id}', '${chapter.id}')">✕</button>
              </div>
            `;
          });
        } else {
          html += `<div class="entry-item" style="padding-left:32px; color:#6a7c94; font-style:italic;">No chapters</div>`;
        }
      });
      list.innerHTML = html;
    }

    function renderUserList() {
      const list = document.getElementById('userList');
      if (!users.length) {
        list.innerHTML = `<div class="empty-state">No users</div>`;
        return;
      }
      let html = '';
      users.forEach(user => {
        html += `
          <div class="entry-item">
            <div class="info">
              <span class="name">${user.email}</span>
              <span class="sub">ID: ${user.id}</span>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="key-btn" onclick="window.viewKeys('${user.id}')">🔑 Keys</button>
              <button class="del-btn" onclick="window.deleteUser('${user.id}')">✕</button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function updatePlaylistSelect() {
      const select = document.getElementById('playlistSelect');
      select.innerHTML = '<option value="">Select playlist</option>';
      playlists.forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      });
    }

    function updateUserSelect() {
      const select = document.getElementById('userSelect');
      select.innerHTML = '<option value="">Select user</option>';
      users.forEach(u => {
        select.innerHTML += `<option value="${u.id}">${u.email}</option>`;
      });
    }

    function updateApiStatus(mode) {
      const el = document.getElementById('apiStatus');
      el.textContent = '🗄️ D1 Database ' + (mode === 'connected' ? '✅' : '');
      if (mode === 'connected') el.classList.add('status-connected');
    }

    function showFeedback(msg, type, elId) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.textContent = msg;
      el.className = 'toast-msg';
      if (type === 'error') el.classList.add('toast-error');
      else if (type === 'success') el.classList.add('toast-success');
      else el.classList.add('toast-info');
      setTimeout(() => { el.textContent = ''; el.className = 'toast-msg'; }, 5000);
    }

    // ----- View Keys (Simple Alert) -----
    window.viewKeys = async function(userId) {
      try {
        const response = await fetch(API_BASE + '/keys?userId=' + userId);
        const data = await response.json();
        if (data.success) {
          let msg = '🔑 Keys for this user:\n\n';
          data.keys.forEach(k => {
            msg += `Key: ${k.key_value}\nUsed: ${k.is_used ? '✅ Used' : '❌ Not used'}\nExpires: ${new Date(k.expires_at).toLocaleString()}\n\n`;
          });
          alert(msg);
        }
      } catch (error) {
        alert('Failed to load keys');
      }
    };

    // ----- Auth -----
    function setupAuth() {
      const passwordGate = document.getElementById('passwordGate');
      const adminContent = document.getElementById('adminContent');
      const unlockBtn = document.getElementById('unlockBtn');
      const pwdInput = document.getElementById('adminPwdInput');
      const pwdError = document.getElementById('pwdError');

      function unlock() {
        if (pwdInput.value === ADMIN_PASSWORD) {
          passwordGate.style.display = 'none';
          adminContent.style.display = 'block';
          pwdError.textContent = '';
          loadPlaylists();
          loadUsers();
        } else {
          pwdError.textContent = '❌ Incorrect password.';
          pwdInput.value = '';
          pwdInput.focus();
        }
      }

      unlockBtn.addEventListener('click', unlock);
      pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

      document.getElementById('logoutBtn').addEventListener('click', function() {
        passwordGate.style.display = 'block';
        adminContent.style.display = 'none';
        pwdInput.value = '';
        pwdError.textContent = '';
      });
    }

    // ----- Make functions globally accessible -----
    window.deletePlaylist = deletePlaylist;
    window.deleteChapter = deleteChapter;
    window.deleteUser = deleteUser;

    // ----- Event Listeners -----
    document.getElementById('addPlaylistBtn').addEventListener('click', addPlaylist);
    document.getElementById('addChapterBtn').addEventListener('click', addChapter);
    document.getElementById('addUserBtn').addEventListener('click', addUser);
    document.getElementById('generateKeyBtn').addEventListener('click', generateKey);
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadPlaylists();
      loadUsers();
      showFeedback('🔄 Refreshed', 'info', 'playlistFeedback');
    });

    // Enter key support
    document.getElementById('newPlaylistName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlaylist(); });
    document.getElementById('chapterName').addEventListener('keydown', e => { if (e.key === 'Enter') addChapter(); });
    document.getElementById('chapterLink').addEventListener('keydown', e => { if (e.key === 'Enter') addChapter(); });
    document.getElementById('newUserEmail').addEventListener('keydown', e => { if (e.key === 'Enter') addUser(); });

    setupAuth();
    console.log('✅ Admin panel loaded. Password: admin123');
  })();
</script>
</body>
</html>
