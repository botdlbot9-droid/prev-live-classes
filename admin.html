<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Playlist Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f4fb; min-height: 100vh; display: flex; justify-content: center; padding: 30px 16px; }
    .app { max-width: 800px; width: 100%; background: white; border-radius: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); padding: 28px 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8edf6; padding-bottom: 18px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-weight: 600; font-size: 1.9rem; color: #0b1a33; }
    .badge { background: #eef3fa; padding: 6px 16px; border-radius: 40px; font-size: 0.8rem; color: #4c637f; }
    label { font-weight: 500; color: #1a2b4c; display: block; margin-top: 16px; margin-bottom: 5px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 12px 16px; border: 1px solid #d9e1ec; border-radius: 20px; font-size: 0.95rem; background: #fafcff; }
    input:focus, select:focus { border-color: #1a2b4c; outline: none; background: white; }
    .row-btns { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .btn-primary { background: #1a2b4c; color: white; border: none; border-radius: 60px; padding: 12px 28px; font-weight: 500; cursor: pointer; flex:1; min-width:120px; }
    .btn-primary:hover { background: #2f4370; }
    .btn-success { background: #1a7a3a; color: white; border: none; border-radius: 60px; padding: 12px 28px; font-weight: 500; cursor: pointer; flex:1; min-width:120px; }
    .btn-success:hover { background: #1f944a; }
    .btn-danger { background: #b33a3a; color: white; border: none; border-radius: 60px; padding: 12px 28px; font-weight: 500; cursor: pointer; }
    .btn-danger:hover { background: #992e2e; }
    .btn-outline { background: transparent; color: #1a2b4c; border: 1px solid #d0dae8; border-radius: 60px; padding: 12px 24px; font-weight: 500; cursor: pointer; }
    .btn-outline:hover { background: #f0f4fe; }
    .btn-sm { padding: 8px 18px; font-size: 0.85rem; }
    .toast-msg { font-size: 0.9rem; margin-top: 12px; padding: 8px 16px; border-radius: 60px; display: inline-block; }
    .toast-error { background: #fee; color: #b33a3a; }
    .toast-success { background: #e6f5e6; color: #1a5d3c; }
    .section-title { font-weight: 600; color: #0b1a33; margin-top: 24px; margin-bottom: 8px; font-size: 1.1rem; border-bottom: 2px solid #e8edf6; padding-bottom: 8px; }
    .entry-list { background: #f5f8fe; border-radius: 20px; padding: 6px 0; margin: 12px 0 6px; max-height: 350px; overflow-y: auto; }
    .entry-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e6edf6; }
    .entry-item:last-child { border-bottom: none; }
    .entry-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .entry-item .name { font-weight: 600; color: #0b1a33; }
    .entry-item .sub { color: #4c637f; font-size: 0.8rem; word-break: break-all; }
    .entry-item .del-btn { background: none; border: none; color: #b33a3a; font-size: 1.2rem; cursor: pointer; padding: 4px 10px; border-radius: 40px; }
    .entry-item .del-btn:hover { background: #ffe6e6; }
    .empty-state { color: #6a7c94; padding: 20px 0; text-align: center; font-style: italic; }
    .api-status { font-size: 0.8rem; color: #4c637f; padding: 6px 14px; background: #eef3fa; border-radius: 40px; display: inline-block; }
    .status-connected { background: #e6f5e6; color: #1a5d3c; }
    .status-error { background: #fee; color: #b33a3a; }
    .password-gate { background: #f8faff; border-radius: 20px; padding: 24px; margin-top: 10px; }
    .password-gate .pwd-error { color: #b33a3a; font-size: 0.9rem; margin-top: 6px; }
    .flex-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .flex-row > * { flex: 1; min-width: 150px; }
    .playlist-header { background: #eef3fa; padding: 10px 16px; font-weight: 700; border-radius: 12px; margin: 8px 0 4px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚙️ Playlist Manager</h1>
    <span class="badge">🔐 Protected</span>
  </div>

  <!-- Password Gate -->
  <div id="passwordGate" class="password-gate">
    <label for="adminPwdInput">Enter admin password</label>
    <input type="password" id="adminPwdInput" placeholder="••••••••" />
    <div id="pwdError" class="pwd-error"></div>
    <div class="row-btns">
      <button class="btn-primary" id="unlockBtn">🔓 Unlock</button>
    </div>
  </div>

  <!-- Admin Content -->
  <div id="adminContent" style="display: none;">
    <div class="flex-row" style="margin-bottom:16px;">
      <span class="api-status" id="apiStatus">🌐 API: local</span>
      <button class="btn-outline btn-sm" id="syncApiBtn" style="flex:0;">🔄 Sync to Cloudflare</button>
      <button class="btn-outline btn-sm" id="loadApiBtn" style="flex:0;">📥 Load from Cloudflare</button>
    </div>

    <!-- Add Playlist -->
    <div class="section-title">📁 Add New Playlist</div>
    <div class="flex-row">
      <input type="text" id="newPlaylistName" placeholder="Playlist name (e.g. Trigonometry)" />
      <button class="btn-success" id="addPlaylistBtn">➕ Add Playlist</button>
    </div>
    <div id="playlistFeedback" class="toast-msg"></div>

    <!-- Add Chapter -->
    <div class="section-title">📝 Add Chapter to Playlist</div>
    <div class="flex-row">
      <select id="playlistSelect">
        <option value="">Select a playlist</option>
      </select>
    </div>
    <div class="flex-row">
      <input type="text" id="chapterName" placeholder="Chapter name" />
      <input type="text" id="chapterLink" placeholder="Video URL (HLS / MP4)" />
    </div>
    <div class="row-btns">
      <button class="btn-primary" id="addChapterBtn">➕ Add Chapter</button>
    </div>
    <div id="chapterFeedback" class="toast-msg"></div>

    <!-- Current Playlists -->
    <div class="section-title">📋 All Playlists & Chapters</div>
    <div class="entry-list" id="adminList">
      <div class="empty-state">Loading...</div>
    </div>
    
    <div style="margin-top:20px; border-top:1px solid #e8edf6; padding-top:18px;">
      <button class="btn-danger" id="logoutBtn" style="padding:8px 24px; font-size:0.85rem;">🚪 Logout</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- CONFIG -----
    const API_BASE = 'https://video-api.your-subdomain.workers.dev/api/playlists';
    const STORAGE_KEY = 'playlistData';
    const ADMIN_PASSWORD = 'admin123';

    let playlists = [];
    let isUnlocked = false;

    // ----- Data Functions -----
    function loadData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          playlists = JSON.parse(stored);
          if (!Array.isArray(playlists)) playlists = [];
        } else {
          playlists = [
            {
              id: 'pl_demo1',
              name: 'Trigonometry',
              chapters: [
                { id: 'ch1', name: 'Chapter 1: Introduction', link: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
                { id: 'ch2', name: 'Chapter 2: Ratios', link: 'https://www.w3schools.com/html/mov_bbb.mp4' }
              ]
            }
          ];
          saveData();
        }
      } catch(e) { playlists = []; }
      updatePlaylistSelect();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(playlists));
      updateApiStatus('local');
      updatePlaylistSelect();
    }

    function genId() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 6); }

    // ----- API Functions -----
    async function loadFromCloudflare() {
      try {
        const response = await fetch(API_BASE);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (data.success && data.playlists) {
          playlists = data.playlists;
          saveData();
          renderAdminList();
          updateApiStatus('connected');
          showFeedback('✅ Loaded from Cloudflare', 'success', 'playlistFeedback');
        }
      } catch (error) {
        showFeedback(`❌ Failed to load: ${error.message}`, 'error', 'playlistFeedback');
        updateApiStatus('error');
      }
    }

    async function syncToCloudflare() {
      try {
        const response = await fetch(API_BASE, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlists: playlists })
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (data.success) {
          showFeedback(`✅ Synced successfully (${data.count} playlists)`, 'success', 'playlistFeedback');
          updateApiStatus('connected');
        }
      } catch (error) {
        showFeedback(`❌ Sync failed: ${error.message}`, 'error', 'playlistFeedback');
        updateApiStatus('error');
      }
    }

    // ----- Add Playlist -----
    async function addPlaylist() {
      const nameInput = document.getElementById('newPlaylistName');
      const name = nameInput.value.trim();
      
      if (!name) {
        showFeedback('⚠️ Please enter a playlist name.', 'error', 'playlistFeedback');
        return;
      }
      
      try {
        // Try to add via API
        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, chapters: [] })
        });
        
        const data = await response.json();
        
        if (data.success) {
          playlists.push(data.playlist);
          saveData();
          nameInput.value = '';
          renderAdminList();
          showFeedback(`✅ Added playlist "${name}"`, 'success', 'playlistFeedback');
          updateApiStatus('connected');
        } else {
          throw new Error(data.error || 'Failed to add');
        }
      } catch (error) {
        // Fallback: Add locally
        const newPlaylist = { id: genId(), name: name, chapters: [] };
        playlists.push(newPlaylist);
        saveData();
        nameInput.value = '';
        renderAdminList();
        showFeedback(`✅ Added playlist "${name}" (local only)`, 'success', 'playlistFeedback');
      }
    }

    // ----- Add Chapter -----
    async function addChapter() {
      const playlistSelect = document.getElementById('playlistSelect');
      const nameInput = document.getElementById('chapterName');
      const linkInput = document.getElementById('chapterLink');
      
      const playlistId = playlistSelect.value;
      const name = nameInput.value.trim();
      const link = linkInput.value.trim();
      
      if (!playlistId || !name || !link) {
        showFeedback('⚠️ Please fill all fields.', 'error', 'chapterFeedback');
        return;
      }
      
      try {
        // Try to add via API
        const response = await fetch(API_BASE + '/chapter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistId, chapterName: name, chapterLink: link })
        });
        
        const data = await response.json();
        
        if (data.success) {
          const playlist = playlists.find(p => p.id === playlistId);
          if (playlist) {
            playlist.chapters.push(data.chapter);
            saveData();
          }
          nameInput.value = '';
          linkInput.value = '';
          renderAdminList();
          showFeedback(`✅ Added chapter "${name}"`, 'success', 'chapterFeedback');
          updateApiStatus('connected');
        } else {
          throw new Error(data.error || 'Failed to add');
        }
      } catch (error) {
        // Fallback: Add locally
        const playlist = playlists.find(p => p.id === playlistId);
        if (playlist) {
          const newChapter = { id: genId(), name: name, link: link };
          playlist.chapters.push(newChapter);
          saveData();
          nameInput.value = '';
          linkInput.value = '';
          renderAdminList();
          showFeedback(`✅ Added chapter "${name}" (local only)`, 'success', 'chapterFeedback');
        }
      }
    }

    // ----- Delete Playlist -----
    function deletePlaylist(playlistId) {
      if (!confirm('Delete this playlist and all its chapters?')) return;
      
      try {
        // Try to delete via API
        fetch(API_BASE, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistId })
        }).catch(() => {});
        
        playlists = playlists.filter(p => p.id !== playlistId);
        saveData();
        renderAdminList();
        showFeedback('🗑️ Playlist deleted.', 'success', 'playlistFeedback');
      } catch (error) {
        showFeedback(`❌ Failed to delete: ${error.message}`, 'error', 'playlistFeedback');
      }
    }

    // ----- Delete Chapter -----
    function deleteChapter(playlistId, chapterId) {
      if (!confirm('Delete this chapter?')) return;
      
      try {
        // Try to delete via API
        fetch(API_BASE + '/chapter', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistId, chapterId })
        }).catch(() => {});
        
        const playlist = playlists.find(p => p.id === playlistId);
        if (playlist) {
          playlist.chapters = playlist.chapters.filter(c => c.id !== chapterId);
          saveData();
        }
        renderAdminList();
        showFeedback('🗑️ Chapter deleted.', 'success', 'playlistFeedback');
      } catch (error) {
        showFeedback(`❌ Failed to delete: ${error.message}`, 'error', 'playlistFeedback');
      }
    }

    // ----- Render Functions -----
    function updatePlaylistSelect() {
      const select = document.getElementById('playlistSelect');
      if (!select) return;
      const currentValue = select.value;
      select.innerHTML = '<option value="">Select a playlist</option>';
      playlists.forEach(p => {
        const option = document.createElement('option');
        option.value = p.id;
        option.textContent = p.name;
        select.appendChild(option);
      });
      if (currentValue && playlists.some(p => p.id === currentValue)) {
        select.value = currentValue;
      }
    }

    function renderAdminList() {
      const list = document.getElementById('adminList');
      if (!playlists.length) {
        list.innerHTML = `<div class="empty-state">No playlists yet. Add one above.</div>`;
        return;
      }
      
      let html = '';
      playlists.forEach(playlist => {
        html += `
          <div class="playlist-header">
            📁 ${playlist.name}
            <button class="del-btn" onclick="window.deletePlaylist('${playlist.id}')" style="background:none;border:none;color:#b33a3a;font-size:1.2rem;cursor:pointer;">✕</button>
          </div>
        `;
        
        if (playlist.chapters && playlist.chapters.length > 0) {
          playlist.chapters.forEach(chapter => {
            html += `
              <div class="entry-item" style="padding-left:32px;">
                <div class="info">
                  <span class="name">${chapter.name}</span>
                  <span class="sub">${chapter.link}</span>
                </div>
                <button class="del-btn" onclick="window.deleteChapter('${playlist.id}', '${chapter.id}')">✕</button>
              </div>
            `;
          });
        } else {
          html += `<div class="entry-item" style="padding-left:32px; color:#6a7c94; font-style:italic;">No chapters</div>`;
        }
      });
      list.innerHTML = html;
    }

    function showFeedback(msg, type, elId) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.textContent = msg;
      el.className = 'toast-msg';
      if (type === 'error') el.classList.add('toast-error');
      else if (type === 'success') el.classList.add('toast-success');
      setTimeout(() => { el.textContent = ''; el.className = 'toast-msg'; }, 4000);
    }

    function updateApiStatus(mode) {
      const el = document.getElementById('apiStatus');
      if (!el) return;
      if (mode === 'local') {
        el.textContent = '🌐 API: local storage';
        el.className = 'api-status';
      } else if (mode === 'connected') {
        el.textContent = '🌐 API: Cloudflare connected';
        el.className = 'api-status status-connected';
      } else if (mode === 'error') {
        el.textContent = '⚠️ API: error';
        el.className = 'api-status status-error';
      }
    }

    // ----- Auth -----
    function setupAuth() {
      const passwordGate = document.getElementById('passwordGate');
      const adminContent = document.getElementById('adminContent');
      const unlockBtn = document.getElementById('unlockBtn');
      const pwdInput = document.getElementById('adminPwdInput');
      const pwdError = document.getElementById('pwdError');

      function unlock() {
        if (pwdInput.value === ADMIN_PASSWORD) {
          passwordGate.style.display = 'none';
          adminContent.style.display = 'block';
          pwdError.textContent = '';
          isUnlocked = true;
          loadData();
          renderAdminList();
        } else {
          pwdError.textContent = '❌ Incorrect password.';
          pwdInput.value = '';
          pwdInput.focus();
        }
      }

      unlockBtn.addEventListener('click', unlock);
      pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

      document.getElementById('logoutBtn').addEventListener('click', function() {
        passwordGate.style.display = 'block';
        adminContent.style.display = 'none';
        pwdInput.value = '';
        pwdError.textContent = '';
        isUnlocked = false;
      });
    }

    // ----- Init -----
    // Make functions globally accessible
    window.deletePlaylist = deletePlaylist;
    window.deleteChapter = deleteChapter;

    document.getElementById('addPlaylistBtn').addEventListener('click', addPlaylist);
    document.getElementById('addChapterBtn').addEventListener('click', addChapter);
    document.getElementById('syncApiBtn').addEventListener('click', syncToCloudflare);
    document.getElementById('loadApiBtn').addEventListener('click', loadFromCloudflare);

    // Enter key support
    document.getElementById('newPlaylistName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlaylist(); });
    document.getElementById('chapterName').addEventListener('keydown', e => { if (e.key === 'Enter') addChapter(); });
    document.getElementById('chapterLink').addEventListener('keydown', e => { if (e.key === 'Enter') addChapter(); });

    setupAuth();
    console.log('✅ Admin panel loaded. Password: admin123');
  })();
</script>
</body>
</html>
