<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel · Video Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f4fb; min-height: 100vh; display: flex; justify-content: center; padding: 30px 16px; }
    .app { max-width: 700px; width: 100%; background: white; border-radius: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); padding: 28px 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8edf6; padding-bottom: 18px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-weight: 600; font-size: 1.9rem; color: #0b1a33; letter-spacing: -0.3px; }
    .header .badge { background: #eef3fa; padding: 6px 16px; border-radius: 40px; font-size: 0.8rem; color: #4c637f; }
    .admin-content { display: block; }
    label { font-weight: 500; color: #1a2b4c; display: block; margin-top: 16px; margin-bottom: 5px; font-size: 0.9rem; }
    input { width: 100%; padding: 12px 16px; border: 1px solid #d9e1ec; border-radius: 20px; font-size: 0.95rem; background: #fafcff; transition: 0.15s; }
    input:focus { border-color: #1a2b4c; outline: none; background: white; box-shadow: 0 0 0 3px rgba(26,43,76,0.08); }
    .row-btns { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .btn-primary { background: #1a2b4c; color: white; border: none; border-radius: 60px; padding: 12px 28px; font-weight: 500; cursor: pointer; flex:1; min-width:120px; transition:0.15s; }
    .btn-primary:hover { background: #2f4370; transform: scale(1.01); }
    .btn-danger { background: #b33a3a; color: white; border: none; border-radius: 60px; padding: 12px 28px; font-weight: 500; cursor: pointer; transition:0.15s; }
    .btn-danger:hover { background: #992e2e; }
    .btn-outline { background: transparent; color: #1a2b4c; border: 1px solid #d0dae8; border-radius: 60px; padding: 12px 24px; font-weight: 500; cursor: pointer; transition:0.15s; }
    .btn-outline:hover { background: #f0f4fe; }
    .toast-msg { font-size: 0.9rem; margin-top: 12px; padding: 8px 16px; border-radius: 60px; background: #e6f0fa; color: #1a3f5c; display: inline-block; }
    .toast-error { background: #fee; color: #b33a3a; }
    .toast-success { background: #e6f5e6; color: #1a5d3c; }
    .entry-list { background: #f5f8fe; border-radius: 20px; padding: 6px 0; margin: 16px 0 6px; max-height: 300px; overflow-y: auto; }
    .entry-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e6edf6; font-size: 0.9rem; }
    .entry-item:last-child { border-bottom: none; }
    .entry-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .entry-item .class-name { font-weight: 600; color: #0b1a33; }
    .entry-item .link-preview { color: #4c637f; font-size: 0.75rem; word-break: break-all; max-width: 220px; }
    .entry-item .del-btn { background: none; border: none; color: #b33a3a; font-size: 1.2rem; cursor: pointer; padding: 4px 10px; border-radius: 40px; transition:0.1s; }
    .entry-item .del-btn:hover { background: #ffe6e6; }
    .empty-state { color: #6a7c94; padding: 20px 0; text-align: center; font-style: italic; }
    .api-status { font-size: 0.8rem; color: #4c637f; margin-top: 8px; padding: 6px 14px; background: #eef3fa; border-radius: 40px; display: inline-block; }
    .status-connected { background: #e6f5e6; color: #1a5d3c; }
    .status-error { background: #fee; color: #b33a3a; }
    .section-title { font-weight: 600; color: #0b1a33; margin-top: 24px; margin-bottom: 8px; font-size: 1.1rem; }
    .password-gate { background: #f8faff; border-radius: 20px; padding: 24px; margin-top: 10px; }
    .password-gate input { margin-bottom: 12px; }
    .password-gate .pwd-error { color: #b33a3a; font-size: 0.9rem; margin-top: 6px; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>⚙️ Admin Panel</h1>
    <span class="badge">🔐 Protected</span>
  </div>

  <!-- Password Gate -->
  <div id="passwordGate" class="password-gate">
    <label for="adminPwdInput">Enter admin password</label>
    <input type="password" id="adminPwdInput" placeholder="••••••••" />
    <div id="pwdError" class="pwd-error"></div>
    <div class="row-btns">
      <button class="btn-primary" id="unlockBtn">🔓 Unlock</button>
    </div>
  </div>

  <!-- Admin Content (hidden until password correct) -->
  <div id="adminContent" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>
        <span class="api-status" id="apiStatus">🌐 API: local</span>
      </div>
      <button class="btn-outline" id="syncApiBtn" style="padding:8px 20px; font-size:0.85rem;">🔄 Sync with Cloudflare</button>
    </div>

    <div class="section-title">➕ Add new video</div>
    <label for="newClassName">Class name</label>
    <input type="text" id="newClassName" placeholder="e.g. 'Tutorial 1'" />
    <label for="newClassLink">Video URL (HLS / MP4)</label>
    <input type="text" id="newClassLink" placeholder="https://example.com/stream.m3u8" />
    <div class="row-btns">
      <button class="btn-primary" id="saveClassBtn">➕ Add entry</button>
    </div>
    <div id="adminFeedback" class="toast-msg"></div>

    <div class="section-title" style="margin-top:28px;">📋 Current entries</div>
    <div class="entry-list" id="adminList">
      <div class="empty-state">Loading...</div>
    </div>
    <div style="margin-top: 6px; font-size:0.75rem; color:#4c637f;">🔁 Data stored in localStorage + Cloudflare sync</div>
    
    <div style="margin-top:20px; border-top:1px solid #e8edf6; padding-top:18px;">
      <button class="btn-danger" id="logoutBtn" style="padding:8px 24px; font-size:0.85rem;">🚪 Logout</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- CONFIG ----------
    // Replace with your Cloudflare Worker / API endpoint
    const API_BASE = 'https://your-cloudflare-worker.workers.dev/api/videos';
    const STORAGE_KEY = 'videoClassData';
    const ADMIN_PASSWORD = 'admin123';  // change as needed

    let videoItems = [];
    let isUnlocked = false;

    // ---------- DATA HELPERS ----------
    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try { videoItems = JSON.parse(stored); if (!Array.isArray(videoItems)) videoItems = []; } 
        catch(e) { videoItems = []; }
      } else {
        videoItems = [
          { id: 'demo1', className: 'Big Buck Bunny (HLS)', link: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' },
          { id: 'demo2', className: 'Sample MP4', link: 'https://www.w3schools.com/html/mov_bbb.mp4' }
        ];
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(videoItems));
      updateApiStatus('local');
    }

    function genId() { return Date.now().toString(36) + Math.random().toString(36).substring(2,6); }

    // ---------- RENDER ADMIN LIST ----------
    function renderAdminList() {
      const list = document.getElementById('adminList');
      if (!list) return;
      if (!videoItems.length) {
        list.innerHTML = `<div class="empty-state">No entries yet. Add one above.</div>`;
        return;
      }
      let html = '';
      videoItems.forEach((item, index) => {
        const name = item.className || 'Unnamed';
        const link = item.link || '';
        html += `
          <div class="entry-item">
            <div class="info">
              <span class="class-name">${name}</span>
              <span class="link-preview">${link.length > 60 ? link.substring(0,60)+'…' : link}</span>
            </div>
            <button class="del-btn" data-id="${item.id}" title="Delete">✕</button>
          </div>
        `;
      });
      list.innerHTML = html;
      
      // Delete events
      list.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const id = this.dataset.id;
          if (!id) return;
          if (confirm('Delete this class?')) {
            videoItems = videoItems.filter(it => it.id !== id);
            saveData();
            renderAdminList();
            showFeedback('🗑️ Deleted successfully.', 'success');
          }
        });
      });
    }

    // ---------- FEEDBACK ----------
    function showFeedback(msg, type = 'info') {
      const el = document.getElementById('adminFeedback');
      el.textContent = msg;
      el.className = 'toast-msg';
      if (type === 'error') el.classList.add('toast-error');
      else if (type === 'success') el.classList.add('toast-success');
      setTimeout(() => {
        if (el.textContent === msg) {
          el.textContent = '';
          el.className = 'toast-msg';
        }
      }, 4000);
    }

    // ---------- API STATUS ----------
    function updateApiStatus(mode) {
      const el = document.getElementById('apiStatus');
      if (mode === 'local') {
        el.textContent = '🌐 API: local storage';
        el.className = 'api-status';
      } else if (mode === 'connected') {
        el.textContent = '🌐 API: Cloudflare connected';
        el.className = 'api-status status-connected';
      } else if (mode === 'error') {
        el.textContent = '⚠️ API: error';
        el.className = 'api-status status-error';
      }
    }

    // ---------- CLOUDFLARE API SYNC ----------
    async function syncWithCloudflare() {
      const statusEl = document.getElementById('apiStatus');
      if (!API_BASE || API_BASE.includes('your-cloudflare')) {
        showFeedback('⚠️ Set API_BASE to your Cloudflare Worker URL.', 'error');
        return;
      }
      try {
        statusEl.textContent = '🔄 Syncing...';
        statusEl.className = 'api-status';
        
        const response = await fetch(API_BASE, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: videoItems })
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        showFeedback(`✅ Synced with Cloudflare (${result.message || 'ok'})`, 'success');
        updateApiStatus('connected');
      } catch (err) {
        showFeedback(`❌ Sync failed: ${err.message}`, 'error');
        updateApiStatus('error');
      }
    }

    // ---------- LOAD FROM CLOUDFLARE ----------
    async function fetchFromCloudflare() {
      if (!API_BASE || API_BASE.includes('your-cloudflare')) return;
      try {
        const resp = await fetch(API_BASE);
        if (!resp.ok) throw new Error('API not reachable');
        const data = await resp.json();
        if (data.items && Array.isArray(data.items)) {
          videoItems = data.items;
          saveData();
          renderAdminList();
          updateApiStatus('connected');
          showFeedback('✅ Loaded from Cloudflare', 'success');
        }
      } catch (e) {
        console.log('Cloudflare fetch failed, using local data');
        updateApiStatus('local');
        loadData();
        renderAdminList();
      }
    }

    // ---------- ADMIN ACTIONS ----------
    function setupAdminActions() {
      document.getElementById('saveClassBtn').addEventListener('click', function() {
        const name = document.getElementById('newClassName').value.trim();
        const link = document.getElementById('newClassLink').value.trim();
        if (!name || !link) { 
          showFeedback('⚠️ Please fill both fields.', 'error'); 
          return; 
        }
        videoItems.push({ id: genId(), className: name, link: link });
        saveData();
        document.getElementById('newClassName').value = '';
        document.getElementById('newClassLink').value = '';
        showFeedback(`✅ Added "${name}"`, 'success');
        renderAdminList();
        updateApiStatus('local');
      });
    }

    // ---------- PASSWORD AUTH ----------
    function setupAuth() {
      const passwordGate = document.getElementById('passwordGate');
      const adminContent = document.getElementById('adminContent');
      const unlockBtn = document.getElementById('unlockBtn');
      const pwdInput = document.getElementById('adminPwdInput');
      const pwdError = document.getElementById('pwdError');
      const logoutBtn = document.getElementById('logoutBtn');

      function unlock() {
        if (pwdInput.value === ADMIN_PASSWORD) {
          passwordGate.style.display = 'none';
          adminContent.style.display = 'block';
          pwdError.textContent = '';
          isUnlocked = true;
          loadData();
          renderAdminList();
          // Try to fetch from Cloudflare
          setTimeout(() => {
            if (API_BASE && !API_BASE.includes('your-cloudflare')) {
              fetchFromCloudflare();
            }
          }, 300);
        } else {
          pwdError.textContent = '❌ Incorrect password.';
          pwdInput.value = '';
          pwdInput.focus();
        }
      }

      unlockBtn.addEventListener('click', unlock);
      pwdInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') unlock();
      });

      logoutBtn.addEventListener('click', function() {
        passwordGate.style.display = 'block';
        adminContent.style.display = 'none';
        pwdInput.value = '';
        pwdError.textContent = '';
        isUnlocked = false;
        showFeedback('🔒 Logged out', 'info');
      });

      // Sync button
      document.getElementById('syncApiBtn').addEventListener('click', syncWithCloudflare);
    }

    // ---------- INIT ----------
    // Load data but don't render until unlocked
    loadData();
    setupAdminActions();
    setupAuth();

    console.log('✅ Admin panel loaded. Password: admin123');
    console.log('🔗 To connect Cloudflare, set API_BASE and deploy a Worker with PUT/GET.');
  })();
</script>
</body>
</html>
